version: '3.8'

services:
  backend:
    build: ./backend
    container_name: ai-agent-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - ./backend/chroma_db:/app/chroma_db
      - ./backend/data:/app/data
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build: ./frontend
    container_name: ai-agent-frontend
    ports:
      - "80:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
